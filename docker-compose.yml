version: "3.9"

services:
  ffmpeg-render-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ffmpeg-render-service:latest
    container_name: ffmpeg-render-service
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEFAULT_WIDTH=${DEFAULT_WIDTH:-1080}
      - DEFAULT_HEIGHT=${DEFAULT_HEIGHT:-1920}
      - DEFAULT_FPS=${DEFAULT_FPS:-30}
      - DEFAULT_CRF=${DEFAULT_CRF:-20}
      - DEFAULT_PRESET=${DEFAULT_PRESET:-medium}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-192k}
      - MUSIC_VOLUME=${MUSIC_VOLUME:-0.1}
      - DELETE_TEMP_AFTER_RENDER=${DELETE_TEMP_AFTER_RENDER:-true}
      - MAX_OUTPUT_AGE_HOURS=${MAX_OUTPUT_AGE_HOURS:-24}
      # Text-to-Speech (Piper - local, offline, no API keys)
      - TTS_MAX_CHARS=${TTS_MAX_CHARS:-5000}
      - TTS_TIMEOUT_MS=${TTS_TIMEOUT_MS:-60000}
      - TTS_MAX_AUDIO_AGE_HOURS=${TTS_MAX_AUDIO_AGE_HOURS:-24}
    volumes:
      # Persist rendered outputs and logs across container restarts
      - ./output:/app/output
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./assets:/app/assets
      - ./public:/app/public
    healthcheck:
      test: ["CMD", "node", "health.js"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
